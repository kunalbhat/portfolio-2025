<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Games & experiments — Kunal Bhat</title>
    <meta name="theme-color" content="#e3beae" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&display=swap" rel="stylesheet" />
    <style>
      :root { --env: #e3beae; --ink: #3b1a2a; --muted: #7a4a55; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        :root { --env: #3c1e40; --ink: #f4e4e6; --muted: #c9a6b4; color-scheme: dark; }
      }
      html, body { margin: 0; min-height: 100%; background: var(--env); color: var(--ink); }
      body { font: 500 17px/1.5 "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
        padding: max(26px, env(safe-area-inset-top)) clamp(20px, 3.2vw, 44px); }
      a { color: inherit; }
      .name { font-size: 22px; text-decoration: none; letter-spacing: -0.01em; }
      main { max-width: 34rem; margin: 18vh 0 0; }
      h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 0.5em; }
      p { color: var(--muted); margin: 0 0 2em; }
      .back { text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <a class="name" href="/desk/">Kunal Bhat</a>
    <main>
      <h1>Games & experiments</h1>
      <p>Small games and creative coding experiments, playable in the browser. Coming soon.</p>
      <a class="back" href="/desk/">← Back to the desk</a>
    </main>
  </body>
</html>
