<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kunal Bhat — Product Designer</title>
    <meta
      name="description"
      content="Multidisciplinary product designer with experience in design, product management, and engineering."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header" id="site-header">
      <div class="site-header-inner">
        <a href="/" class="logo-link" id="logo-link">
          <span class="logo-icon">
            <img src="/images/site-icon.svg" alt="Site icon" width="40" height="40" />
          </span>
          <span class="logo-text">Kunal Bhat</span>
        </a>
      </div>
    </header>

    <div class="page-container">
      <main class="main-content">
        <header class="intro">
          <h1 class="headline">
            Greetings — I’m Kunal, a Chicago-based visual designer and curious builder.
          </h1>
        </header>

        <ul class="portfolio-grid">
          <li>
            <figure>
              <div class="portfolio-card">
                <video autoplay muted loop playsinline preload="auto">
                  <source src="/videos/aura-captions.mp4" type="video/mp4" />
                </video>
              </div>
              <figcaption class="portfolio-caption">
                <h4 class="portfolio-title">Aura Captions</h4>
                <span class="portfolio-year">'24</span>
              </figcaption>
            </figure>
          </li>
        </ul>
      </main>

      <footer class="site-footer">
        <span>&copy; 2025 Kunal Bhat — Chicago</span>
      </footer>
    </div>

    <script src="/script.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
