<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kunal Bhat</title>
    <meta
      name="description"
      content="Kunal Bhat's name, built from blocks. You can take it apart."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Cpath d='M0 4V0a4 4 0 0 1 4 4z' fill='%23365bc5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <canvas id="sculpture" aria-hidden="true"></canvas>

    <header class="masthead">
      <a href="./" class="name">Kunal Bhat</a>
      <p class="role">Designer</p>
    </header>
    <div class="controls">
      <button
        type="button"
        id="rebuild"
        class="restore"
        aria-label="Restore composition"
        aria-disabled="true"
      >
        <span class="tile">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <g class="press-light">
              <rect x="2.5" y="2.5" width="5" height="5" />
              <rect x="9" y="2.5" width="5" height="5" />
              <rect x="2.5" y="9" width="5" height="5" />
              <rect class="restore-loose" x="9" y="9" width="5" height="5" />
            </g>
            <g class="press-cut">
              <rect x="2" y="2" width="5" height="5" />
              <rect x="8.5" y="2" width="5" height="5" />
              <rect x="2" y="8.5" width="5" height="5" />
              <rect class="restore-loose" x="8.5" y="8.5" width="5" height="5" />
            </g>
          </svg>
        </span>
        <span class="restore-tip" aria-hidden="true">Restore composition</span>
      </button>
      <button
        type="button"
        id="theme"
        class="theme"
        aria-label="Toggle color theme"
        aria-pressed="false"
      >
        <span class="tile">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <g class="press-light">
              <circle class="theme-ring" cx="8.5" cy="8.5" r="4" />
              <path class="theme-night" d="M8.5 4.5 A4 4 0 0 1 8.5 12.5 Z" />
            </g>
            <g class="press-cut">
              <circle class="theme-ring" cx="8" cy="8" r="4" />
              <path class="theme-night" d="M8 4 A4 4 0 0 1 8 12 Z" />
            </g>
          </svg>
        </span>
      </button>
    </div>

    <div class="floor" aria-hidden="true"></div>

    <script src="./vendor/matter.min.js"></script>
    <script src="./sculpture.js"></script>
    <script src="./theme.js"></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
      window.si =
        window.si ||
        function () {
          (window.siq = window.siq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
